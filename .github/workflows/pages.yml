# Publish SpaceSweepers as a static site on GitHub Pages.
#
# GitHub Pages serves files only, so it cannot run the Python server or the local SI model. This workflow runs the app once,
# in-process, writes every answer of its API to a file (python -m app.static_export) and publishes the result. The dashboard
# views are then the same data and the same calculations as the live app; SI Insights (the chat) shows a notice instead.
#
# This workflow and the static export live on the `demo` branch only. `main` is the full app that runs locally with the SI model and
# is not touched by any of this.
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions". The github-pages environment must also allow
# deployments from the `demo` branch (Settings > Environments > github-pages > Deployment branches).
name: Pages

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false  # never interrupt a deploy halfway

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - name: Check the exporter and the packaged data
        run: |
          python -m pytest -q tests/test_static_export.py
          python -m app.warm
      - name: Build the site
        run: python -m app.static_export --out _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # publish the site
      id-token: write   # prove the deploy comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
