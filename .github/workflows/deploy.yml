# Secure deploy for SpaceSweepers.
# 1. Run the full security suite (security.yml) — any failure stops the deploy.
# 2. Run the unit tests.
# 3. Build the container, scan the image itself, and only then push it to GHCR
#    with an SBOM and build provenance, and sign it keylessly with Sigstore cosign.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # never interrupt a deploy halfway

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security:
    name: Security gate
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Packaged data check (complete snapshot, no stale table mappings)
        run: python -m app.warm

  build-and-publish:
    name: Build, scan, sign & publish image
    needs: [security, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production  # add required reviewers in repo settings for a manual approval step
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: spacesweepers:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image (packaged data answers without Ollama or network)
        run: |
          docker run -d --name ss -p 8000:8000 -e 'SS_ALLOWED_HOSTS=["127.0.0.1"]' spacesweepers:scan
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/meta >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/api/meta
          curl -sf "http://127.0.0.1:8000/api/sweeper?family=solid_burn" >/dev/null
          docker logs ss | grep -q "failed its start-up check" && { docker logs ss; exit 1; } || true
          docker rm -f ss

      - name: Scan image (Grype) — block on high/critical with a fix available
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: spacesweepers:scan
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image with SBOM + provenance
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image (keyless, by digest)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag%%:*}@${DIGEST}"
          done

      - name: Deploy summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          {
            echo "# 🚀 SpaceSweepers deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Security gate | ✅ SAST · SCA · Secrets passed |"
            echo "| Unit tests | ✅ passed |"
            echo "| Packaged data | ✅ 26 investigations, no stale mappings; container smoke test passed |"
            echo "| Image scan | ✅ Grype: no fixable high/critical |"
            echo "| Image | \`${IMAGE}@${DIGEST}\` |"
            echo "| Tags | $(echo "$TAGS" | sed 's/.*:/`/;s/$/`/' | paste -sd ' ' -) |"
            echo "| Supply chain | SBOM + SLSA provenance attached · cosign keyless signature |"
            echo ""
            echo "Verify the signature:"
            echo '```bash'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
