<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t">
  <title id="t">SpaceSweepers mark: a modern Minesweeper board with a flagged microgravity flame</title>
  <defs>
    <!-- Unrevealed tile: soft modern bevel (light top-left, dark bottom-right) -->
    <linearGradient id="raised" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4e56"/>
      <stop offset="1" stop-color="#25272c"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fc3d21"/>
      <stop offset="0.65" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffc23d"/>
    </linearGradient>
    <radialGradient id="core" cx="0.42" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#dff0ff"/>
      <stop offset="0.45" stop-color="#5aa9ff"/>
      <stop offset="1" stop-color="#1c67e3"/>
    </radialGradient>
    <!-- Revealed "1": geometric numeral -->
    <path id="one" d="M-2.6 -9 L2.4 -9 L2.4 7.2 L5.6 7.2 L5.6 10 L-5.6 10 L-5.6 7.2 L-2.2 7.2 L-2.2 -4.5 L-5.3 -2.9 L-6.6 -5.6 Z" fill="#4f8fff"/>
    <g id="revealed"><rect width="36" height="36" rx="7" fill="#15171a" stroke="#2e3136" stroke-width="1.5"/></g>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fc3d21" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fc3d21" stop-opacity="0"/>
    </radialGradient>
    <g id="hidden">
      <rect width="36" height="36" rx="7" fill="url(#raised)"/>
      <path d="M7 1.5 H29 a5.5 5.5 0 0 1 5.5 5.5" fill="none" stroke="#6a6f78" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Row A -->
  <use href="#revealed" x="4" y="4"/>   <use href="#one" x="22" y="22"/>
  <use href="#revealed" x="46" y="4"/>  <use href="#one" x="64" y="22"/>
  <use href="#hidden" x="88" y="4"/>
  <!-- Row B -->
  <use href="#revealed" x="4" y="46"/>  <use href="#one" x="22" y="64"/>
  <use href="#hidden" x="88" y="46"/>
  <rect x="40" y="40" width="48" height="48" rx="12" fill="url(#glow)"/>
  <use href="#hidden" x="46" y="46"/>
  <rect x="46.75" y="46.75" width="34.5" height="34.5" rx="6.5" fill="none" stroke="#fc3d21" stroke-width="1.5"/>
  <!-- Row C -->
  <use href="#hidden" x="4" y="88"/>
  <use href="#revealed" x="46" y="88"/> <use href="#one" x="64" y="106"/>
  <use href="#revealed" x="88" y="88"/> <use href="#one" x="106" y="106"/>

  <!-- Centre: the flagged hazard. Flag pole + flame-shaped flag with a blue spherical core
       (a candle flame in microgravity becomes a blue sphere). -->
  <g transform="translate(64 64)">
    <rect x="-9" y="-13" width="2.6" height="25" rx="1.3" fill="#f2f3f5"/>
    <rect x="-13" y="10" width="14" height="3.2" rx="1.6" fill="#f2f3f5"/>
    <path d="M-6.5 -12.5 C -2 -13.5, 1 -13, 3 -16.5 C 4.6 -12.6, 7.6 -11.4, 11.5 -13.5 C 10.4 -9.6, 13.8 -6.4, 15 -3.2 C 15.8 2.8, 9.6 6.6, -6.5 5 C -2.6 2.6, -3.4 -1.6, -6.5 -3.6 C -2.6 -5.8, -3.2 -9.4, -6.5 -12.5 Z" fill="url(#flame)"/>
    <circle cx="4.6" cy="-3.2" r="4.6" fill="url(#core)"/>
  </g>
</svg>
